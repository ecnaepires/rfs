<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RFS — The Road</title>
    <link rel="icon" href="assets/logo.svg" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet" />
    <style>
      /* "The Road" v4 — real road, real destinations, no AI turns.
         The drive is the straight-ahead footage (what the AI does well). At each
         company the car brakes just before the camera would turn, the frame
         freezes and develops into a sharp photograph of the building, then
         dissolves into the next stretch of road. Self-driving with stops;
         scroll / arrows / tap step between stops. Odometer, optional sound,
         the RFS mark rising over the night road at the end. */
      :root {
        --gold: #d4af37;
        --gold-dim: rgb(212 175 55 / .45);
        --ink: #000;
        --panel: rgb(8 8 10 / .78);
        --paper: oklch(96% 0.01 90);
        --muted: oklch(80% 0.02 90);
        --ease: cubic-bezier(.2, .7, .2, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); }
      body { font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      button { font: inherit; color: inherit; }

      #stage { position: fixed; inset: 0; overflow: hidden; background: #000 center / cover no-repeat; }
      #stage video {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        opacity: 0; transition: opacity .9s ease-in-out;
      }
      #stage video.active { opacity: 1; }
      #stage::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(to bottom, rgb(0 0 0 / .55), transparent 20%, transparent 64%, rgb(0 0 0 / .72)),
          radial-gradient(ellipse at center, transparent 58%, rgb(0 0 0 / .3));
      }

      /* the photograph the frozen frame develops into */
      #photo { position: fixed; inset: 0; z-index: 2; overflow: hidden; opacity: 0; pointer-events: none; transition: none; }
      #photo.on { transition: opacity 1s ease; }
      /* leaving a stop: a short dip to black instead of two scenes dissolving into each other */
      #dip { position: fixed; inset: 0; z-index: 5; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s ease-in; }
      #dip.on { opacity: 1; }
      #dip.out { transition: opacity .8s ease-out; }
      #photo.on { opacity: 1; }
      /* the still is the exact frame the video froze on, so the fade is invisible;
         then the camera slowly pushes in toward the building's side of the road */
      #photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; transition: opacity .5s ease; }
      #photo.left img { transform-origin: 22% 48%; }
      #photo.right img { transform-origin: 78% 48%; }
      #photo.on img { animation: look 11s cubic-bezier(.2, .6, .2, 1) forwards; }
      #photo.front img { animation: none; transform: none; }
      @keyframes look { from { transform: scale(1); } to { transform: scale(1.32); } }
      #photo::after {
        content: ""; position: absolute; inset: 0;
        background:
          linear-gradient(to bottom, rgb(0 0 0 / .55), transparent 22%, transparent 62%, rgb(0 0 0 / .72)),
          radial-gradient(ellipse at center, transparent 55%, rgb(0 0 0 / .42));
      }
      #develop { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 45%, rgb(212 175 55 / .35), transparent 60%); }
      #develop.on { animation: develop 1.4s ease-out; }
      @keyframes develop { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

      /* the RFS mark rising on the horizon at the end of the night road */
      #mark { position: fixed; z-index: 4; left: 50%; top: 40%; width: min(26vw, 22vh); translate: -50% -50%; pointer-events: none; opacity: 0; transition: opacity 2.5s ease; filter: drop-shadow(0 0 40px rgb(212 175 55 / .8)) drop-shadow(0 0 120px rgb(212 175 55 / .45)); }
      #mark.on { opacity: 1; }
      #mark img { width: 100%; display: block; }

      /* trip odometer */
      #odo { position: fixed; z-index: 15; left: 22px; bottom: 84px; display: flex; align-items: baseline; gap: 8px; font: 700 11px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .18em; color: var(--gold); opacity: 0; transition: opacity .6s; }
      #odo.on { opacity: 1; }
      #odo b { font: 800 22px/1 "Archivo", sans-serif; font-stretch: 118%; letter-spacing: .02em; color: var(--paper); font-variant-numeric: tabular-nums; }

      /* ---------- header ---------- */
      header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 20;
        display: flex; align-items: center; gap: 10px; padding: 16px 22px;
      }
      header .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
      header img { height: 28px; }
      header .name { font-stretch: 125%; font-weight: 800; letter-spacing: .14em; font-size: 12px; color: var(--gold); }
      .hbtn {
        display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
        font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
        background: rgb(0 0 0 / .35); border: 1px solid var(--gold-dim); border-radius: 99px;
        color: var(--paper); cursor: pointer; backdrop-filter: blur(6px);
      }
      .hbtn:hover { border-color: var(--gold); }
      .hbtn[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
      .hbtn:focus-visible, .rm-stop:focus-visible, .card button:focus-visible, .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
      .hbtn svg { width: 12px; height: 12px; fill: currentColor; }

      /* ---------- highway sign ---------- */
      .sign {
        position: fixed; z-index: 10; top: 13vh; pointer-events: none;
        display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center;
        padding: 12px 18px 12px 14px; min-width: 250px;
        background: #0b0b0c; border: 2px solid var(--gold); border-radius: 6px;
        box-shadow: 0 0 0 4px #0b0b0c, 0 18px 40px rgb(0 0 0 / .45);
        opacity: 0; transform: translateY(-10px) scale(.92); transform-origin: top;
        transition: opacity .5s var(--ease), transform .5s var(--ease);
      }
      .sign.on { opacity: 1; transform: none; }
      .sign.left { left: 6vw; } .sign.right { right: 6vw; }
      .sign .arrow {
        grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center;
        border: 2px solid var(--gold); border-radius: 50%; color: var(--gold);
      }
      .sign .arrow svg { width: 16px; height: 16px; fill: currentColor; }
      .sign.right .arrow svg { transform: scaleX(-1); }
      .sign .exit { font-size: 10px; font-weight: 800; letter-spacing: .26em; color: var(--gold); }
      .sign .sname { font-stretch: 112%; font-weight: 800; font-size: 20px; line-height: 1.05; }
      .sign .dist {
        grid-column: 2; font: 700 11px/1 ui-monospace, "SFMono-Regular", monospace; color: var(--muted);
        letter-spacing: .06em; margin-top: 4px;
      }

      /* ---------- company card ---------- */
      .card {
        position: fixed; z-index: 11; bottom: 92px; width: min(400px, calc(100vw - 32px));
        padding: 22px 24px 18px; background: var(--panel); backdrop-filter: blur(10px);
        border: 1px solid rgb(212 175 55 / .28); border-top: 2px solid var(--gold); border-radius: 4px;
        opacity: 0; transform: translateY(18px); pointer-events: none;
        transition: opacity .5s var(--ease), transform .5s var(--ease);
      }
      .card.on { opacity: 1; transform: none; pointer-events: auto; }
      .card.left { left: 5vw; } .card.right { right: 5vw; }
      .card .num { font-size: 10px; font-weight: 800; letter-spacing: .26em; color: var(--gold); }
      .card h3 { margin: 8px 0 0; font-stretch: 118%; font-weight: 800; font-size: 30px; line-height: 1.02; }
      .card .tag { margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
      .card .line { margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
      .card .more { list-style: none; margin: 0; padding: 0; overflow: hidden; max-height: 0; transition: max-height .45s var(--ease); }
      .card.open .more { max-height: 220px; }
      .card .more li { position: relative; padding: 7px 0 7px 16px; font-size: 14px; border-top: 1px solid rgb(255 255 255 / .08); }
      .card .more li:first-child { margin-top: 12px; }
      .card .more li::before { content: ""; position: absolute; left: 0; top: 14px; width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }
      .card .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .card .plus {
        height: 32px; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
        background: transparent; border: 1px solid var(--gold-dim); border-radius: 99px; cursor: pointer;
      }
      .card .plus:hover { border-color: var(--gold); }
      .card .back {
        width: 32px; height: 32px; margin-left: auto; display: grid; place-items: center;
        background: transparent; border: 1px solid var(--gold-dim); border-radius: 50%; cursor: pointer;
      }
      .card .back svg { width: 12px; height: 12px; fill: currentColor; }

      /* continue button with countdown ring */
      .go {
        --p: 0;
        position: relative; height: 36px; padding: 0 16px 0 40px; cursor: pointer;
        font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
        color: #0b0b0c; background: var(--gold); border: 0; border-radius: 99px;
      }
      .go::before {
        content: ""; position: absolute; left: 8px; top: 8px; width: 20px; height: 20px; border-radius: 50%;
        background: conic-gradient(#0b0b0c calc(var(--p) * 1turn), rgb(0 0 0 / .18) 0);
        -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px);
                mask: radial-gradient(circle, transparent 5px, #000 6px);
      }

      /* ---------- chapter titles ---------- */
      .title {
        position: fixed; z-index: 10; left: 50%; top: 46%; width: min(900px, 90vw);
        translate: -50% -50%; text-align: center; pointer-events: none;
      }
      .title::before {
        content: ""; position: absolute; inset: -14% -8%; z-index: -1; opacity: 0;
        background: radial-gradient(closest-side, rgb(0 0 0 / .62), transparent);
        transition: opacity .6s ease;
      }
      .title.on::before { opacity: 1; }
      .title .kicker { display: block; margin-bottom: 14px; font-size: 12px; font-weight: 800; letter-spacing: .3em; color: var(--gold);
        opacity: 0; transition: opacity .6s ease; }
      .title.on .kicker { opacity: 1; }
      .title h1, .title h2 {
        margin: 0; font-stretch: 125%; font-weight: 800; line-height: 1.02; letter-spacing: -.01em;
        font-size: clamp(34px, 6vw, 84px); text-wrap: balance; text-shadow: 0 2px 30px rgb(0 0 0 / .45);
      }
      .title .w { display: inline-block; opacity: 0; transform: translateY(.35em); filter: blur(6px);
        transition: opacity .7s var(--ease), transform .7s var(--ease), filter .7s var(--ease); }
      .title.on .w { opacity: 1; transform: none; filter: none; }
      .title p { margin: 18px auto 0; max-width: 640px; font-size: clamp(15px, 1.6vw, 19px); line-height: 1.5; font-weight: 500;
        text-shadow: 0 1px 3px rgb(0 0 0 / .9), 0 0 18px rgb(0 0 0 / .6);
        opacity: 0; transform: translateY(10px); transition: opacity .7s ease .5s, transform .7s var(--ease) .5s; }
      .title.on p { opacity: 1; transform: none; }
      .title .facts { display: flex; gap: 34px; justify-content: center; margin-top: 26px; opacity: 0; transition: opacity .7s ease .8s; }
      .title.on .facts { opacity: 1; }
      .title .facts div { text-align: center; }
      .title .facts b { display: block; font-stretch: 125%; font-weight: 800; font-size: clamp(26px, 3.4vw, 44px); color: var(--gold); line-height: 1; }
      .title .facts span { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
      .title .actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
        opacity: 0; transition: opacity .6s ease .9s; pointer-events: auto; }
      .title.on .actions { opacity: 1; }
      .title:not(.on) .actions { pointer-events: none; }
      .cta {
        display: inline-flex; align-items: center; height: 42px; padding: 0 20px; border-radius: 99px; cursor: pointer;
        font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
        color: #0b0b0c; background: var(--gold); border: 1px solid var(--gold);
      }
      .cta.ghost { color: var(--paper); background: rgb(0 0 0 / .35); border-color: var(--gold-dim); }

      /* ---------- road map ---------- */
      #roadmap {
        position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; height: 74px; padding: 0 5vw;
        background: linear-gradient(to top, rgb(0 0 0 / .75), transparent);
      }
      .rm-track { position: absolute; left: 5vw; right: 5vw; bottom: 30px; height: 2px; background: rgb(255 255 255 / .18); }
      .rm-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold); }
      .rm-car {
        position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
        background: var(--gold); box-shadow: 0 0 0 4px rgb(212 175 55 / .25), 0 0 16px var(--gold);
      }
      .rm-stop {
        position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; padding: 0;
        background: transparent; border: 0; cursor: pointer;
      }
      .rm-stop::before {
        content: ""; position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; border-radius: 50%;
        background: #0b0b0c; border: 1.5px solid var(--gold);
      }
      .rm-stop.chapter::before { left: 9px; top: 5px; width: 3px; height: 12px; border-radius: 1px; background: var(--gold-dim); border: 0; }
      .rm-stop.passed::before { background: var(--gold); }
      .rm-stop.end::before { left: 5px; top: 5px; width: 12px; height: 12px; }
      .rm-stop .lbl {
        position: absolute; bottom: 20px; left: 50%; translate: -50% 0; white-space: nowrap;
        font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--paper);
        padding: 4px 8px; background: #0b0b0c; border: 1px solid var(--gold-dim); border-radius: 3px;
        opacity: 0; transition: opacity .2s; pointer-events: none;
      }
      .rm-stop:hover .lbl, .rm-stop:focus-visible .lbl { opacity: 1; }
      .rm-meta {
        position: absolute; left: 5vw; right: 5vw; bottom: 42px; display: flex; justify-content: space-between;
        font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
      }
      .rm-meta .hint { color: rgb(255 255 255 / .5); }

      /* ---------- start gate ---------- */
      #gate {
        position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
        background: radial-gradient(ellipse at center, rgb(0 0 0 / .35), rgb(0 0 0 / .8));
        transition: opacity .8s ease;
      }
      #gate.gone { opacity: 0; pointer-events: none; }
      #gate img { height: 64px; }
      #gate .gname { display: block; margin-top: 16px; font-stretch: 125%; font-weight: 800; letter-spacing: .3em; font-size: 14px; color: var(--gold); }
      #gate p { margin: 18px auto 28px; max-width: 420px; font-size: 15px; line-height: 1.55; color: var(--muted); }
      #gate .cta { height: 48px; padding: 0 28px; }
      #gate .how { margin-top: 18px; font-size: 11px; letter-spacing: .14em; color: rgb(255 255 255 / .45); text-transform: uppercase; }

      @media (max-width: 760px) {
        header { padding: 12px 14px; gap: 6px; }
        header .name, #skip .t { display: none; }
        .hbtn { padding: 0 10px; }
        .sign { top: 11vh; min-width: 0; }
        .sign.left, .sign.right { left: 16px; right: auto; }
        .card, .card.left, .card.right { left: 12px; right: 12px; width: auto; bottom: 84px; padding: 18px 18px 14px; }
        .card h3 { font-size: 24px; }
        .rm-meta .hint { display: none; }
        #odo { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #stage video, .sign, .card, .title .w, .title p, .title::before { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <div id="photo" aria-hidden="true"><img alt="" /></div>
    <div id="develop" aria-hidden="true"></div>
    <div id="dip" aria-hidden="true"></div>
    <div id="mark" aria-hidden="true"><img src="assets/logo.svg" alt="" /></div>
    <div id="odo"><span data-t="odo"></span><b id="odo-km">0.0</b><span>km</span></div>

    <header>
      <div class="brand"><img src="assets/logo.svg" alt="RFS" /><span class="name" data-t="brand"></span></div>
      <button class="hbtn" id="play" type="button" aria-label="Pause"><svg viewBox="0 0 12 12" id="play-ico"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg></button>
      <button class="hbtn" id="sound" type="button" aria-pressed="false" aria-label="Sound"><svg viewBox="0 0 12 12"><path d="M1 4h2.5L7 1v10L3.5 8H1z"/><path d="M8.5 3.5a3 3 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="hbtn" id="skip" type="button"><span class="t" data-t="skip"></span><svg viewBox="0 0 12 12"><path d="M1 1l5 5-5 5zM6 1l5 5-5 5z"/></svg></button>
      <button class="hbtn" data-lang="en" type="button">EN</button>
      <button class="hbtn" data-lang="pt" type="button">PT</button>
    </header>

    <div class="sign" id="sign" aria-hidden="true">
      <span class="arrow"><svg viewBox="0 0 16 16"><path d="M9 2L3 8l6 6V10h5V6H9z"/></svg></span>
      <span class="exit"></span>
      <span class="sname"></span>
      <span class="dist"></span>
    </div>

    <section class="card" id="card" aria-live="polite">
      <div class="num"></div>
      <h3></h3>
      <div class="tag"></div>
      <p class="line"></p>
      <ul class="more"></ul>
      <div class="row">
        <button class="go" type="button"></button>
        <button class="plus" type="button" aria-expanded="false"></button>
        <button class="back" type="button"><svg viewBox="0 0 12 12"><path d="M8 1L3 6l5 5z"/></svg></button>
      </div>
    </section>

    <div class="title" id="title" aria-live="polite"></div>

    <nav id="roadmap" aria-label="Road map">
      <div class="rm-meta"><span id="rm-where"></span><span class="hint" data-t="hint"></span></div>
      <div class="rm-track"><div class="rm-fill" id="rm-fill"></div><div class="rm-car" id="rm-car"></div></div>
    </nav>

    <div id="gate">
      <div>
        <img src="assets/logo.svg" alt="" />
        <span class="gname" data-t="brand"></span>
        <p data-t="gate"></p>
        <button class="cta" id="start" type="button" data-t="start"></button>
        <div class="how" data-t="how"></div>
      </div>
    </div>

    <script>
      const UI = {
        en: {
          brand: "RFS HOLDING GROUP", skip: "Contact", start: "Start the drive",
          gate: "A drive through the energy ecosystem RFS governs — ten companies, one road.",
          how: "It plays by itself · scroll, arrows or tap to move between stops",
          hint: "Scroll · ← → · tap", go: "Continue", more: "+ Details", less: "− Details",
          exit: "EXIT", of: "of", pause: "Pause", play: "Play", replay: "Replay the drive",
          visit: "Visit sunergies.com.br →", arriving: "Arriving", odo: "TRIP",
          founded: "founded", structured: "structured", lifecycle: "full lifecycle", endtoend: "End-to-end",
        },
        pt: {
          brand: "RFS GRUPO HOLDING", skip: "Contato", start: "Iniciar o percurso",
          gate: "Um percurso pelo ecossistema de energia que a RFS governa — dez empresas, uma estrada.",
          how: "Avança sozinho · role, use as setas ou toque para ir entre as paradas",
          hint: "Role · ← → · toque", go: "Continuar", more: "+ Detalhes", less: "− Detalhes",
          exit: "SAÍDA", of: "de", pause: "Pausar", play: "Reproduzir", replay: "Refazer o percurso",
          visit: "Visite sunergies.com.br →", arriving: "Chegando", odo: "PERCURSO",
          founded: "fundação", structured: "estruturados", lifecycle: "ciclo completo", endtoend: "Ponta a ponta",
        },
      };

      // stop = second in the clip where the camera is looking at the building
      // (measured from frame strips). side = where the building is on screen;
      // the card goes on the other side so it never covers it.
      const CLIPS = [
        { f: "00-opener", d: 14, kind: "hero", titleAt: [0.3, 9],
          en: { kicker: "RFS HOLDING GROUP", h: "Building the future of energy.", p: "Long-horizon governance for an integrated energy ecosystem in Brazil." },
          pt: { kicker: "RFS GRUPO HOLDING", h: "Construindo o futuro da energia.", p: "Governança de longo prazo para um ecossistema integrado de energia no Brasil." } },
        { f: "01-pylons", d: 10, kind: "chapter", titleAt: [1.2, 8.6], rate: 1.25,
          en: { h: "One holding. An ecosystem of energy.", p: "Built to operate for decades, not quarters." },
          pt: { h: "Uma holding. Um ecossistema de energia.", p: "Construído para operar por décadas, não trimestres." } },
        { f: "07-substation", d: 10, kind: "chapter", titleAt: [1.2, 8.6], rate: 1.25,
          en: { h: "One strategic center. One operating platform.", p: "Multiple routes to market." },
          pt: { h: "Um centro estratégico. Uma plataforma operacional.", p: "Múltiplas rotas para o mercado." } },
        { f: "02-usinas", d: 12, stop: 5.5, out: 5.5, photo: "usinas", side: "left", n: "Usinas de Investimento",
          en: { t: "Generation", p: "Develops and holds power-generation assets — the base layer of the ecosystem.", s: ["Global investment funds"] },
          pt: { t: "Geração", p: "Desenvolve e detém ativos de geração de energia — a camada-base do ecossistema.", s: ["Fundos globais de investimento"] } },

            r *= rateMult;
            rateNow += (r - rateNow) * Math.min(1, dt * 2.2);
            if (Math.abs(v.playbackRate - rateNow) > 0.005) v.playbackRate = Math.max(0.25, rateNow);
            // a play() can be swallowed by a load/seek racing it; keep the car moving
            if (!paused && v.paused && !v.seeking && v.readyState >= 2 && !v.ended) v.play().catch(() => {});
            if (v.readyState >= 2 && !v.classList.contains("active")) v.classList.add("active");

            if (c.stop != null && !stopDone && t >= c.stop) enterStop();
            else if (v.duration && (c.stop == null || stopDone) && t >= outPt(c) - 0.4) {
              if (cur < CLIPS.length - 1) setActive(cur + 1, inPt(CLIPS[cur + 1]));
              else v.pause();
            }
          } else if (state === "stop" && cruise && !paused && !cardHover && !card.classList.contains("open") && c.kind !== "end") {
            holdLeft -= dt;
            if (holdLeft <= 0) drive();
          }
          card.querySelector(".go").style.setProperty("--p", cruise && !paused ? String(1 - Math.max(0, holdLeft) / HOLD) : "0");

          updateSign(c, t);
          if (!c.side) {
            const [a, b] = c.titleAt || [0, 99];
            const on = (t >= a && t < b) || (state === "stop" && !c.side);
            title.classList.toggle("on", on);
          }

          // road map
          const pos = c.start + Math.min(t, c.d);
          $("#odo-km").textContent = (pos / total * 124).toFixed(1);
          if (ac && humGain) { // sound follows the car
            const vv = soundOn && state === "drive" && !paused ? clamp01(rateNow / 1.3) : 0;
            humGain.gain.setTargetAtTime(0.10 * vv + (soundOn ? 0.015 : 0), ac.currentTime, 0.2);
            windGain.gain.setTargetAtTime(0.09 * vv * vv, ac.currentTime, 0.3);
            hum.frequency.setTargetAtTime(44 + 40 * vv, ac.currentTime, 0.3);
          }
          const pct = pos / total * 100;
          $("#rm-fill").style.width = pct + "%";
          $("#rm-car").style.left = pct + "%";
          CLIPS.forEach((k) => k.mark.classList.toggle("passed", k.markAt <= pos + 0.01));
          const where = c.side ? UI[lang].exit + " " + String(c.unit).padStart(2, "0") + " · " + c.n : c[lang].h;
          $("#rm-where").textContent = where;
        }
        requestAnimationFrame(loop);
      }

      applyLang(lang);
      updatePlayBtn();
      stage.style.backgroundImage = "url(assets/video/00-opener.jpg)";
      requestAnimationFrame(loop);
      if (new URLSearchParams(location.search).has("autostart")) begin();
    </script>
  </body>
</html>
