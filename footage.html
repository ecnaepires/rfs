<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RFS — The Road (footage preview)</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet" />
    <style>
      /* Footage preview of "The Road": the Higgsfield / Kling 3.0 drive clips
         (9 Sep 2026) scrubbed by scroll. Standalone — index.html is untouched. */
      :root {
        --gold: #d4af37;
        --ink: #000;
        --paper: oklch(96% 0.01 90);
        --muted: oklch(80% 0.02 90);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ink); color: var(--paper); }
      body { font-family: "Archivo", system-ui, sans-serif; }
      #track { position: relative; }
      #stage {
        position: fixed; inset: 0; overflow: hidden;
        background: #000 center / cover no-repeat;
      }
      .lang { display: flex; gap: 2px; }
      .lang button {
        font: 700 11px/1 "Archivo", system-ui, sans-serif; letter-spacing: .12em;
        padding: 7px 9px; cursor: pointer; background: transparent;
        color: var(--muted); border: 1px solid transparent; border-radius: 4px;
      }
      .lang button[aria-pressed="true"] { color: var(--gold); border-color: rgb(212 175 55 / .5); }
      .lang button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      #stage video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; opacity: 0; transition: none;
      }
      #stage::after { /* legibility vignette */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(to bottom, rgb(0 0 0 / .55), transparent 22%, transparent 62%, rgb(0 0 0 / .7)),
          radial-gradient(ellipse at center, transparent 55%, rgb(0 0 0 / .35));
      }

      header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 5;
        display: flex; align-items: center; gap: 12px; padding: 18px 24px;
      }
      header img { height: 30px; }
      header .name { font-stretch: 125%; font-weight: 800; letter-spacing: .14em; font-size: 13px; color: var(--gold); }
      header .badge {
        margin-left: auto; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
        border: 1px solid rgb(212 175 55 / .5); color: var(--gold); padding: 5px 10px; border-radius: 99px;
      }

      .ov {
        position: fixed; z-index: 4; pointer-events: none;
        opacity: 0; transform: translateY(14px);
        transition: opacity .45s ease, transform .45s ease;
      }
      .ov.on { opacity: 1; transform: none; }
      .ov-center { left: 50%; top: 50%; width: min(880px, 90vw); translate: -50% -50%; text-align: center; }
      .ov-center h1, .ov-center h2 {
        margin: 0; font-stretch: 125%; font-weight: 800; line-height: 1.02;
        font-size: clamp(34px, 6vw, 84px); letter-spacing: -.01em; text-wrap: balance;
        text-shadow: 0 2px 30px rgb(0 0 0 / .5);
      }
      .ov-center::before { /* soft dark pool so text holds on bright footage */
        content: ""; position: absolute; inset: -12% -8%; z-index: -1;
        background: radial-gradient(closest-side, rgb(0 0 0 / .72), transparent);
      }
      .ov-center p { margin: 18px auto 0; max-width: 620px; font-size: clamp(15px, 1.6vw, 19px); line-height: 1.5; color: var(--paper); font-weight: 500; text-shadow: 0 1px 3px rgb(0 0 0 / .9), 0 0 18px rgb(0 0 0 / .7); }
      .ov-center .kicker { display: block; margin-bottom: 14px; font-size: 12px; font-weight: 700; letter-spacing: .3em; color: var(--gold); }

      .card {
        bottom: 9vh; width: min(380px, calc(100vw - 32px));
        padding: 22px 24px; border-left: 2px solid var(--gold);
        background: rgb(0 0 0 / .52); backdrop-filter: blur(6px);
      }
      .card.left { left: 5vw; }
      .card.right { right: 5vw; }
      .card .num { font-size: 11px; letter-spacing: .24em; color: var(--gold); font-weight: 700; }
      .card .n { display: block; margin-top: 8px; font-stretch: 118%; font-weight: 800; font-size: 28px; line-height: 1.05; }
      .card .t { display: block; margin-top: 4px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
      .card p { margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }

      #rail {
        position: fixed; z-index: 5; right: 18px; top: 50%; translate: 0 -50%;
        display: flex; flex-direction: column; gap: 7px;
      }
      #rail button {
        width: 9px; height: 9px; padding: 0; border-radius: 50%; cursor: pointer;
        border: 1px solid var(--gold); background: transparent;
      }
      #rail button.on { background: var(--gold); }
      #rail button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

      #cue {
        position: fixed; z-index: 4; left: 50%; bottom: 26px; translate: -50% 0;
        font-size: 11px; letter-spacing: .3em; color: var(--gold); transition: opacity .4s;
      }
      #loading {
        position: fixed; z-index: 6; left: 24px; bottom: 22px; font-size: 11px;
        letter-spacing: .14em; color: var(--muted);
      }
      #clipinfo {
        position: fixed; z-index: 5; left: 24px; bottom: 22px; font: 11px/1.4 ui-monospace, monospace;
        color: rgb(255 255 255 / .55);
      }
      @media (max-width: 700px) {
        .card, .card.left, .card.right { left: 16px; right: 16px; width: auto; bottom: 12vh; }
        #rail { right: 8px; }
        header { padding: 14px 16px; }
        header .name, header .badge { display: none; }
        .lang { margin-left: auto; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ov { transition: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <header>
      <img src="assets/logo.svg" alt="RFS" />
      <span class="name">RFS HOLDING GROUP</span>
      <span class="badge">Footage preview</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button>
      </div>
    </header>
    <nav id="rail" aria-label="Chapters"></nav>
    <div id="overlays"></div>
    <div id="cue">SCROLL</div>
    <div id="loading">Loading footage…</div>
    <div id="clipinfo"></div>
    <main id="track"></main>

    <script>
      // Each clip gets a slice of the scroll track proportional to its length.
      // SCROLL_PER_SEC = viewport-heights of scrolling per second of footage.
      const SCROLL_PER_SEC = 0.55;
      // Light runs one way: dawn -> morning -> afternoon -> golden hour ->
      // sunset -> afterglow at the flagship -> night.
      // Copy is from index.html's I18N (en/pt) except the night line.
      const CLIPS = [
        { f: "00-opener", d: 14, kind: "hero",
          en: { kicker: "RFS HOLDING GROUP", h: "Building the future of energy.",
                p: "Long-horizon governance for an integrated energy ecosystem in Brazil." },
          pt: { kicker: "RFS GRUPO HOLDING", h: "Construindo o futuro da energia.",
                p: "Governança de longo prazo para um ecossistema integrado de energia no Brasil." } },
        { f: "01-pylons", d: 10, kind: "center",
          en: { h: "One holding. An ecosystem of energy.", p: "Built to operate for decades, not quarters." },
          pt: { h: "Uma holding. Um ecossistema de energia.", p: "Construído para operar por décadas, não trimestres." } },
        { f: "07-substation", d: 10, kind: "center",
          en: { h: "One strategic center. One operating platform.", p: "Multiple routes to market." },
          pt: { h: "Um centro estratégico. Uma plataforma operacional.", p: "Múltiplas rotas para o mercado." } },
        { f: "02-usinas", d: 12, side: "left", n: "Usinas de Investimento",
          en: { t: "Generation", p: "Develops and holds power-generation assets — the base layer of the ecosystem." },
          pt: { t: "Geração", p: "Desenvolve e detém ativos de geração de energia — a camada-base do ecossistema." } },
        { f: "03-sungov", d: 12, side: "right", n: "SunGov Deals",
          en: { t: "Government", p: "PPAs, distributed generation, proprietary plants and energy-efficiency programs for the public sector." },
          pt: { t: "Governo", p: "PPAs, geração distribuída, usinas próprias e programas de eficiência energética para o setor público." } },
        { f: "04-sunnews", d: 12, side: "left", n: "Sun News",
          en: { t: "Media", p: "News, blog, internal communications and podcast — the voice of the ecosystem." },
          pt: { t: "Mídia", p: "Notícias, blog, endomarketing e podcast — a voz do ecossistema." } },
        { f: "05-suncashback", d: 12, side: "right", n: "SunCashback",
          en: { t: "Benefits", p: "Cashback, benefits and incentives that can convert into discounts or new investments." },
          pt: { t: "Benefícios", p: "Cashback, benefícios e incentivos que podem ser convertidos em descontos ou novos investimentos." } },
        { f: "06-sunlife", d: 12, side: "left", n: "SunLife",
          en: { t: "Health", p: "Health plans, telemedicine and medical services for the group's network." },
          pt: { t: "Saúde", p: "Plano de saúde, telemedicina e serviços médicos para a rede do grupo." } },
        { f: "08-sunpower", d: 12, side: "right", n: "SunPower Deals",
          en: { t: "Corporate", p: "Long-term clean-power solutions for corporate clients, from PPAs to proprietary plants." },
          pt: { t: "Corporativo", p: "Soluções de energia limpa de longo prazo para clientes corporativos, de PPAs a usinas próprias." } },
        { f: "09-sunsquad", d: 12, side: "left", n: "SunSquad",
          en: { t: "Partners", p: "The group's partner-development arm, connecting its network, referral programs and mentorship." },
          pt: { t: "Parceiros", p: "A frente de desenvolvimento de parceiros do grupo, conectando rede, indicações e mentoria." } },
        { f: "10-sunchargers", d: 12, side: "right", n: "SunChargers",
          en: { t: "Mobility", p: "An EV-charging network and convenience concept integrated with clean energy." },
          pt: { t: "Mobilidade", p: "Rede de eletropostos e conceito de conveniência integrados à energia limpa." } },
        { f: "11-sundex", d: 12, side: "left", n: "Sundex",
          en: { t: "Digital", p: "Tokenized solar plants and fractional participation on blockchain, designed to broaden access and liquidity." },
          pt: { t: "Digital", p: "Usinas solares tokenizadas e participação fracionada em blockchain, voltadas a ampliar acesso e liquidez." } },
        { f: "12-pdi", d: 12, side: "right", n: "P&DI",
          en: { t: "Innovation", p: "Research, development, education and carbon-credit initiatives for the energy transition." },
          pt: { t: "Inovação", p: "Pesquisa, desenvolvimento, educação e iniciativas de crédito de carbono para a transição energética." } },
        { f: "13-flagship", d: 10, kind: "center",
          en: { kicker: "FLAGSHIP", h: "Sunergies",
                p: "Since 2014, Sunergies has structured and executed solar projects end-to-end — modeling, execution, grid approval and operation — with more than 500 MW across Brazil." },
          pt: { kicker: "CARRO-CHEFE", h: "Sunergies",
                p: "Desde 2014, a Sunergies estrutura e executa projetos solares de ponta a ponta — modelagem, execução, homologação e operação — com mais de 500 MW pelo Brasil." } },
        { f: "14-night", d: 12, kind: "center",
          en: { kicker: "RFS HOLDING GROUP", h: "Built for the long horizon.", p: "Contact details to be confirmed by the owner." },
          pt: { kicker: "RFS GRUPO HOLDING", h: "Feito para o longo horizonte.", p: "Contatos a confirmar pelo proprietário." } },
      ];

      const stage = document.getElementById("stage");
      const overlays = document.getElementById("overlays");
      const rail = document.getElementById("rail");
      const cue = document.getElementById("cue");
      const loading = document.getElementById("loading");
      const clipinfo = document.getElementById("clipinfo");
      const debug = new URLSearchParams(location.search).has("debug");

      // ---- build scroll track + per-clip elements ----
      let acc = 0;
      let unitNo = 0;
      CLIPS.forEach((c, i) => {
        c.start = acc; acc += c.d; c.end = acc;

        const v = document.createElement("video");
        v.muted = true; v.playsInline = true; v.preload = i < 3 ? "auto" : "metadata";
        v.poster = "assets/video/" + c.f + ".jpg";
        v.src = "assets/video/" + c.f + ".mp4";
        stage.appendChild(v);
        c.video = v;

        const ov = document.createElement("div");
        if (c.side) {
          unitNo++;
          ov.className = "ov card " + c.side;
          ov.innerHTML = '<span class="num">' + String(unitNo).padStart(2, "0") + ' / 10</span>' +
            '<span class="n"></span><span class="t"></span><p></p>';
          ov.querySelector(".n").textContent = c.n;
        } else {
          ov.className = "ov ov-center";
          ov.innerHTML = (c.en.kicker ? '<span class="kicker"></span>' : "") +
            (c.kind === "hero" ? "<h1></h1>" : "<h2></h2>") + "<p></p>";
        }
        overlays.appendChild(ov);
        c.ov = ov;

        const b = document.createElement("button");
        b.type = "button";
        b.addEventListener("click", () => scrollToTime(c.start + (c.kind === "hero" ? 0 : 0.4) * c.d));
        rail.appendChild(b);
        c.btn = b;
      });

      // ---- language: EN default, PT one click away, remembered ----
      let lang = "en";
      try { if (localStorage.getItem("rfs-lang") === "pt") lang = "pt"; } catch (e) {}
      const langButtons = [...document.querySelectorAll(".lang button")];
      function applyLang(next) {
        lang = next;
        document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
        try { localStorage.setItem("rfs-lang", lang); } catch (e) {}
        CLIPS.forEach((c) => {
          const s = c[lang];
          if (c.side) {
            c.ov.querySelector(".t").textContent = s.t;
            c.ov.querySelector("p").textContent = s.p;
          } else {
            if (s.kicker) c.ov.querySelector(".kicker").textContent = s.kicker;
            c.ov.querySelector("h1, h2").textContent = s.h;
            c.ov.querySelector("p").textContent = s.p;
          }
          const label = c.n || s.h;
          c.btn.setAttribute("aria-label", label);
          c.btn.title = label;
        });
        langButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
        cue.textContent = lang === "pt" ? "ROLE" : "SCROLL";
        document.querySelector("header .name").textContent = lang === "pt" ? "RFS GRUPO HOLDING" : "RFS HOLDING GROUP";
      }
      langButtons.forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));
      applyLang(lang);
      const TOTAL = acc;
      const track = document.getElementById("track");
      track.style.height = (TOTAL * SCROLL_PER_SEC * 100 + 100) + "vh";

      function scrollMax() { return document.documentElement.scrollHeight - innerHeight; }
      function timeFromScroll() { return (scrollY / Math.max(1, scrollMax())) * TOTAL; }
      function scrollToTime(t) {
        scrollTo({ top: (t / TOTAL) * scrollMax(), behavior: "smooth" });
      }

      // ---- loading: first clips eagerly, then the rest one after another ----
      let ready = 0;
      let nextToLoad = 3;
      function loadNext() {
        if (nextToLoad >= CLIPS.length) return;
        const v = CLIPS[nextToLoad++].video;
        if (v.preload !== "auto") { v.preload = "auto"; v.load(); }
      }
      CLIPS.forEach((c) => c.video.addEventListener("canplaythrough", () => {
        ready++;
        loading.textContent = "Loading footage… " + ready + "/" + CLIPS.length;
        if (ready >= 3) loading.style.display = "none";
        loadNext();
      }, { once: true }));

      // ---- render loop: lerp toward scroll target, seek the active clip ----
      const FADE = 0.45; // seconds of crossfade at each clip boundary
      let cur = 0;
      let lastIdx = -1;
      function frame() {
        const target = timeFromScroll();
        cur += (target - cur) * 0.12;
        if (Math.abs(target - cur) < 0.002) cur = target;
        const t = Math.min(Math.max(cur, 0), TOTAL - 0.001);

        let idx = CLIPS.findIndex((c) => t >= c.start && t < c.end);
        if (idx < 0) idx = CLIPS.length - 1;
        const c = CLIPS[idx];
        const local = t - c.start;

        CLIPS.forEach((k, i) => {
          let o = 0;
          if (i === idx) o = 1;
          // fade the next clip in over the tail of the current one
          if (i === idx + 1 && local > c.d - FADE) o = (local - (c.d - FADE)) / FADE;
          // until a clip can show a frame, the stage shows its poster instead of black
          k.video.style.opacity = k.video.readyState >= 2 ? o : 0;
          if (o > 0) {
            const lt = i === idx ? local : 0;
            const want = Math.min(lt, (k.video.duration || k.d) - 0.05);
            if (Math.abs(k.video.currentTime - want) > 0.03 && !k.video.seeking) k.video.currentTime = want;
          }
          // keep neighbours buffered
          if (Math.abs(i - idx) <= 1 && k.video.preload !== "auto") { k.video.preload = "auto"; k.video.load(); }

          // overlay timing: centre text through the middle, unit card during the glance
          const kl = t - k.start;
          const on = k.side
            ? (i === idx && kl > k.d * 0.28 && kl < k.d * 0.8)
            : (i === idx && kl >= (k.kind === "hero" ? 0 : k.d * 0.15) && kl < k.d * 0.78);
          k.ov.classList.toggle("on", on);
          k.btn.classList.toggle("on", i === idx);
        });

        if (idx !== lastIdx) {
          lastIdx = idx;
          stage.style.backgroundImage = "url(assets/video/" + c.f + ".jpg)";
          if (debug) clipinfo.textContent = c.f + ".mp4";
        }
        cue.style.opacity = t < 1.5 ? 1 : 0;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
